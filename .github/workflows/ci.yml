name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bubbli
          POSTGRES_PASSWORD: bubbli
          POSTGRES_DB: bubbli_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bubbli"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://bubbli:bubbli@localhost:5432/bubbli_test
      DATABASE_MIGRATION_URL: postgresql://bubbli:bubbli@localhost:5432/bubbli_test
      # CI never calls a provider: tests exercise the degradation path. The key
      # is a placeholder so the config guard is satisfied and still enforced.
      DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
      AI_PROVIDER_ORDER: deepseek
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Migrations from empty
        run: pnpm db:migrate
      - run: pnpm test
      - name: Corpus gate (G4)
        run: pnpm corpus:eval
      - name: Guard mutation gate (G3)
        run: pnpm test:mutation
