name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bubbli
          POSTGRES_PASSWORD: bubbli
          POSTGRES_DB: bubbli_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bubbli"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://bubbli:bubbli@localhost:5432/bubbli_test
      DATABASE_MIGRATION_URL: postgresql://bubbli:bubbli@localhost:5432/bubbli_test
      # CI never calls a provider: tests exercise the degradation path. The key
      # is a placeholder so the config guard is satisfied and still enforced.
      DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
      AI_PROVIDER_ORDER: deepseek
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Migrations from empty
        run: pnpm db:migrate

      # src/db/schema.ts and drizzle/ drifted once already: the login_attempts
      # foreign key was removed from the model, never generated into a
      # migration, and dropped by hand on one database. Dev, CI and production
      # then disagreed, and nothing noticed.
      #
      # `drizzle-kit check` does NOT catch this — it validates journal and
      # snapshot consistency, not model-vs-migration agreement. `generate`
      # does: it writes nothing when the two are in sync, so a dirty tree here
      # means someone changed the model without generating the migration.
      - name: Schema drift (model vs migrations)
        run: |
          pnpm exec drizzle-kit generate --name drift_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/db/schema.ts has changes with no migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain drizzle/
            git --no-pager diff -- drizzle/
            exit 1
          fi
          echo "schema and migrations agree"
      - run: pnpm test
      - name: Corpus gate (G4)
        run: pnpm corpus:eval
      - name: Guard mutation gate (G3)
        run: pnpm test:mutation

  # Separate job: it needs neither a database nor the app's environment, and
  # keeping it apart means a dependency advisory does not sit behind a
  # ten-minute mutation run before anyone sees it.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # `high` is the gate, not `critical`. This product holds children's
      # conversations, and a high-severity advisory in a dependency that touches
      # the request path is not something to carry to the next sprint.
      - name: Dependency audit
        run: pnpm audit --audit-level high

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks compares against history, so a shallow clone reports a
          # clean tree while the secret sits one commit back.
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
